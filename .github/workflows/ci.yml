name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r scoreboard-api/requirements.txt

      - name: Install development dependencies
        run: |
          pip install -r scoreboard-api/requirements-dev.txt